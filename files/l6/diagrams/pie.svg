<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 661.109375 450" style="max-width: 1200px; background-color: rgb(248, 250, 252); max-height: 1200px;" role="graphics-document document" aria-roledescription="pie"><style>#my-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:18px;fill:#17202c;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:hsl(195, 100%, 97.9411764706%);}#my-svg .error-text{fill:rgb(10.4999999999, 2.625, 0);stroke:rgb(10.4999999999, 2.625, 0);}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#445466;stroke:#445466;}#my-svg .marker.cross{stroke:#445466;}#my-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:18px;}#my-svg p{margin:0;}#my-svg .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#my-svg .pieCircle.highlighted{scale:1.05;opacity:1;}#my-svg .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#my-svg .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#my-svg .pieTitleText{text-anchor:middle;font-size:25px;fill:#17202c;font-family:"trebuchet ms",verdana,arial,sans-serif;}#my-svg .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#17202c;font-size:17px;}#my-svg .legend text{fill:#17202c;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}#my-svg .node .neo-node{stroke:#bd6249;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#bd6249;filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"/><path d="M0,-185A185,185,0,0,1,0,185L0,0Z" fill="#ff7354" class="pieCircle"/><path d="M0,185A185,185,0,0,1,-185,0L0,0Z" fill="#76b5c5" class="pieCircle"/><path d="M-185,0A185,185,0,0,1,-108.74,-149.668L0,0Z" fill="#e5bd6a" class="pieCircle"/><path d="M-108.74,-149.668A185,185,0,0,1,0,-185L0,0Z" fill="#b0b6ca" class="pieCircle"/><text transform="translate(138.75,-3.0808688933348094e-14)" class="slice" style="text-anchor: middle;">50%</text><text transform="translate(-98.11106588963337,98.11106588963357)" class="slice" style="text-anchor: middle;">25%</text><text transform="translate(-123.6271552311361,-62.99118183886199)" class="slice" style="text-anchor: middle;">15%</text><text transform="translate(-42.8761079695241,-131.95909163595252)" class="slice" style="text-anchor: middle;">10%</text></g><text x="0" y="-200" class="pieTitleText">Бюджет кампании, тыс. рублей</text><g class="legend" transform="translate(216,-44)"><rect width="18" height="18" style="fill: rgb(255, 115, 84); stroke: rgb(255, 115, 84);"/><text x="22" y="14">Реклама [600]</text></g><g class="legend" transform="translate(216,-22)"><rect width="18" height="18" style="fill: rgb(118, 181, 197); stroke: rgb(118, 181, 197);"/><text x="22" y="14">Контент [300]</text></g><g class="legend" transform="translate(216,0)"><rect width="18" height="18" style="fill: rgb(229, 189, 106); stroke: rgb(229, 189, 106);"/><text x="22" y="14">Мероприятия [180]</text></g><g class="legend" transform="translate(216,22)"><rect width="18" height="18" style="fill: rgb(176, 182, 202); stroke: rgb(176, 182, 202);"/><text x="22" y="14">Резерв [120]</text></g></g></svg>